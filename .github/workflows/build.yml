name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x ./gradlew
      
      - name: Create local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ONESIGNAL_ID: ${{ secrets.ONESIGNAL_ID }}
        run: |
          echo "supabaseUrl=$SUPABASE_URL" >> local.properties
          echo "supabaseKey=$SUPABASE_KEY" >> local.properties
          echo "oneSignalId=$ONESIGNAL_ID" >> local.properties

      - name: Build APK & AAB
        run: |
          ./gradlew assembleDebug
          ./gradlew bundleDebug

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
